[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-task-cli"
version = "0.1.0"
description = "A command-line task manager for the packaging assignment"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tasker = "tasker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
